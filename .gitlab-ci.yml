stages:          # List of stages for jobs, and their order of execution
  - build
  - deploy

variables:
  DOCKER_IMAGE_PREFIX: "bodyscan-python-"
  DOCKER_IMAGE_TAG: "$DOCKER_IMAGE_PREFIX$CI_COMMIT_REF_NAME"
  DOCKER_TLS_CERTDIR: "/certs"


build:       # This job runs in the build stage, which runs first.
  environment: $CI_COMMIT_REF_NAME
  image: docker:20.10.16
  stage: build
  only:
    - staging
    - master
  services:
    - docker:20.10.16-dind

  before_script:
    - touch .env
    - echo "$ENV_FILE" > .env
    - echo "$docker_key" | docker login --username "$docker_username" --password-stdin
     
  script:
    - pwd
    - ls
    - cat .env
    - docker build -t $DOCKER_IMAGE_TAG .
    - docker tag $DOCKER_IMAGE_TAG codistan/bodyscan-python:$DOCKER_IMAGE_TAG
    - docker push codistan/bodyscan-python:$DOCKER_IMAGE_TAG

    
deploy:      # This job runs in the deploy stage.
  environment: $CI_COMMIT_REF_NAME
  stage: deploy
  only:
    - staging
    - master

  before_script:
    - apt update
    - touch .env
    - mkdir ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$private_key" | tr -d '\r' | ssh-add -
    - chmod 700 /root/.ssh
    - ssh-keyscan -H "$hostname" >> ~/.ssh/known_hosts

  script:
    - ssh -o StrictHostKeyChecking=no $user@$hostname
    - ssh -o StrictHostKeyChecking=no $user@$hostname sudo docker login -u $docker_username -p $docker_key
    - ssh -o StrictHostKeyChecking=no $user@$hostname sudo docker image rm -f codistan/bodyscan-python:$DOCKER_IMAGE_TAG || true
    - ssh -o StrictHostKeyChecking=no $user@$hostname docker image prune -f || true
    - ssh -o StrictHostKeyChecking=no $user@$hostname sudo docker pull codistan/bodyscan-python:$DOCKER_IMAGE_TAG
    - ssh -o StrictHostKeyChecking=no $user@$hostname sudo docker rm -f python-api || true
    - ssh -o StrictHostKeyChecking=no $user@$hostname sudo docker run --name python-api -d -it -p 8000:8000 codistan/bodyscan-python:$DOCKER_IMAGE_TAG